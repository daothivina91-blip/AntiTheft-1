name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Unzip project
      run: |
        if [ -f AntiTheft_Fixed.zip ]; then
          unzip -o AntiTheft_Fixed.zip -d .
        elif [ -f AntiTheft.zip ]; then
          unzip -o AntiTheft.zip -d .
        fi

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Force Fix SDK Version to 34
      run: |
        find . -name "build.gradle*" -exec sed -i 's/compileSdk 35/compileSdk 34/g' {} +
        find . -name "build.gradle*" -exec sed -i 's/compileSdk = 35/compileSdk = 34/g' {} +
        find . -name "build.gradle*" -exec sed -i 's/compileSdk 36/compileSdk 34/g' {} +
        find . -name "build.gradle*" -exec sed -i 's/compileSdk = 36/compileSdk = 34/g' {} +
        find . -name "build.gradle*" -exec sed -i 's/targetSdk 35/targetSdk 34/g' {} +
        find . -name "build.gradle*" -exec sed -i 's/targetSdk = 35/targetSdk = 34/g' {} +
        find . -name "build.gradle*" -exec sed -i 's/targetSdk 36/targetSdk 34/g' {} +
        find . -name "build.gradle*" -exec sed -i 's/targetSdk = 36/targetSdk = 34/g' {} +

    - name: Build Debug APK
      run: |
        GRADLEW_PATH=$(find . -name "gradlew" | head -n 1)
        if [ -z "$GRADLEW_PATH" ]; then
          echo "Không tìm thấy gradlew!"
          exit 1
        fi
        PROJECT_DIR=$(dirname "$GRADLEW_PATH")
        cd "$PROJECT_DIR"
        echo "sdk.dir=$ANDROID_HOME" > local.properties
        chmod +x gradlew
        ./gradlew assembleDebug -x test --continue

    - name: Upload APK Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: '**/*.apk'
