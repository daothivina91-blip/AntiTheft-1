name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Unzip project
      run: |
        if [ -f AntiTheft_Fixed.zip ]; then
          unzip -o AntiTheft_Fixed.zip -d .
        elif [ -f AntiTheft.zip ]; then
          unzip -o AntiTheft.zip -d .
        fi

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Fix minSdk and Manifest issues
      run: |
        # 1. Nâng minSdk từ 19 lên 21 trong toàn bộ file Gradle
        find . -name "build.gradle*" -exec sed -i 's/minSdk 19/minSdk 21/g' {} +
        find . -name "build.gradle*" -exec sed -i 's/minSdk = 19/minSdk = 21/g' {} +
        find . -name "build.gradle*" -exec sed -i 's/minSdkVersion 19/minSdkVersion 21/g' {} +

        # 2. Xóa thuộc tính package="..." khỏi AndroidManifest.xml để tránh xung đột namespace
        find . -name "AndroidManifest.xml" -exec sed -i 's/package="[^"]*"//g' {} +

    - name: Build Debug APK
      run: |
        GRADLEW_PATH=$(find . -name "gradlew" | head -n 1)
        if [ -z "$GRADLEW_PATH" ]; then
          echo "Không tìm thấy gradlew!"
          exit 1
        fi
        PROJECT_DIR=$(dirname "$GRADLEW_PATH")
        cd "$PROJECT_DIR"
        echo "sdk.dir=$ANDROID_HOME" > local.properties
        chmod +x gradlew
        ./gradlew assembleDebug -x test --continue

    - name: Upload APK Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: '**/*.apk'
